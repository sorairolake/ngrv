[package]
name = "ngrv"
version = "0.1.3"
edition = "2024"
rust-version = "1.85.0"
description = "A terminal-based pipe viewer similar to `pv(1)`"
repository = "https://github.com/sorairolake/ngrv"
license = "GPL-3.0-or-later"
keywords = ["pb", "progress", "progressbar"]
categories = ["command-line-utilities"]
include = ["/LICENSES", "/README.md", "/src"]

[dependencies]
anyhow = "1.0.100"
byte-unit = "5.1.6"
clap = { version = "4.5.52", features = ["derive", "wrap_help"] }
clap_complete = "4.5.61"
clap_complete_nushell = "4.5.10"
indicatif = "0.18.3"
jiff = { version = "0.2.16", default-features = false, features = ["std"] }
sigpipe = "0.1.3"
sysexits = "0.10.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
